<text class="k-h2" x="2068.0" y="478.0" text-anchor="start" direction="rtl">עקרונות הסימון</text>
<text class="k-note2" x="2068.0" y="508.0" text-anchor="start" direction="rtl">• הכול מסומן מהעמוד הקיים, לא מהגדר:</text>
<text class="k-note2" x="2068.0" y="535.0" text-anchor="start" direction="rtl">  R4 = 150 מדרום לפאה הדרומית שלו;</text>
<text class="k-note2" x="2068.0" y="562.0" text-anchor="start" direction="rtl">  R3, R2, R1 — כל 168 ס״מ דרומה.</text>
<text class="k-note2" x="2068.0" y="589.0" text-anchor="start" direction="rtl">• ציר השביל = מרכז הפשפש. רוחב 150.</text>
<text class="k-note2" x="2068.0" y="616.0" text-anchor="start" direction="rtl">• ארבעה רומים זהים, 16 ס״מ — חובה.</text>
<text class="k-note2" x="2068.0" y="643.0" text-anchor="start" direction="rtl">• חזית מדרגה סגורה ואנכית, בלי</text>
<text class="k-note2" x="2068.0" y="670.0" text-anchor="start" direction="rtl">  בסיס נסוג (החלטה); חריץ צל בצדדים.</text>
<text class="k-note2" x="2068.0" y="697.0" text-anchor="start" direction="rtl">• פודסטים 2.9% לכיוון השער;</text>
<text class="k-note2" x="2068.0" y="724.0" text-anchor="start" direction="rtl">  הרחבה 1.5% מהדלת החוצה.</text>
<text class="k-note2" x="2068.0" y="751.0" text-anchor="start" direction="rtl">• מימין לעמוד — ≈150 אל הדלת;</text>
<text class="k-note2" x="2068.0" y="778.0" text-anchor="start" direction="rtl">  משמאלו — 197 ישר לאבני המדרך.</text>
<text class="k-note2" x="2068.0" y="805.0" text-anchor="start" direction="rtl">• ערוגות ממולאות עד 15 ס״מ מתחת</text>
<text class="k-note2" x="2068.0" y="832.0" text-anchor="start" direction="rtl">  לשפת הבטון (לא נפילה חופשית).</text>
<text class="k-note2" x="2068.0" y="859.0" text-anchor="start"></text>
<text class="k-h2" x="2068.0" y="894.0" text-anchor="start" direction="rtl">לבדוק בשטח לפני יציקה</text>
<text class="k-note2" x="2068.0" y="924.0" text-anchor="start" direction="rtl">• מדידת בקרה: שער, 4 אפים, עמוד,</text>
<text class="k-note2" x="2068.0" y="951.0" text-anchor="start" direction="rtl">  סף דלת, מכסה השוחה.</text>
<text class="k-note2" x="2068.0" y="978.0" text-anchor="start" direction="rtl">• מיקום השוחה (±20). קרוב מ־15</text>
<text class="k-note2" x="2068.0" y="1005.0" text-anchor="start" direction="rtl">  ס״מ ל־R1 — להזיז את R1 צפונה.</text>
<text class="k-note2" x="2068.0" y="1032.0" text-anchor="start" direction="rtl">• קיר חדר שינה 2: ≈150 מהעמוד</text>
<text class="k-note2" x="2068.0" y="1059.0" text-anchor="start" direction="rtl">  לפי נופר; 149 כולל עמוד במפה</text>
<text class="k-note2" x="2068.0" y="1086.0" text-anchor="start" direction="rtl">  המצבית — מטר אחד בשטח מכריע.</text>
<text class="k-note2" x="2068.0" y="1113.0" text-anchor="start" direction="rtl">• רוחב כנף הפשפש (כאן 101).</text>
